services:
  postgres:
    image: postgres:16-alpine
    container_name: crewly-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-crewly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crewly_secret}
      POSTGRES_DB: ${DB_NAME:-crewly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crewly} -d ${DB_NAME:-crewly}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
