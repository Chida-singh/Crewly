openapi: 3.0.3
info:
  title: Crewly API
  version: 0.1.0
  description: Direct hiring marketplace API for India's creative workforce.
paths:
  /health:
    get:
      summary: Health check
      description: Returns service status and database connectivity.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: up
        '503':
          description: Service or database is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  database:
                    type: string
                    example: down
